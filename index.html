<script>
const data={Dell:["Latitude 7490","Latitude 5490","Latitude 5420","Inspiron","Vostro","XPS","Other"],HP:["EliteBook 840 G8","EliteBook 840 G7","ProBook 440 G8","ProBook 450 G8","Pavilion","Victus","Other"],Lenovo:["ThinkPad T480","ThinkPad T490","ThinkPad T14","ThinkPad L470","ThinkPad L480","IdeaPad","Other"],Apple:["MacBook Pro","MacBook Air","MacBook Pro M1","MacBook Air M1","MacBook Pro 14-inch","MacBook Pro 16-inch","Other"],Asus:["VivoBook","ZenBook","ROG","TUF Gaming","ExpertBook","Other"],Acer:["Aspire","Swift","TravelMate","Nitro","Other"],MSI:["Modern","Prestige","GF Series","Katana","Other"],Toshiba:["Tecra","Satellite","Portégé","Other"],Samsung:["Galaxy Book","Notebook","Other"],Microsoft:["Surface Laptop","Surface Pro","Other"],Other:["Other / I don't know"]};
const issues=["Laptop not turning on","Not charging","Battery problem","Screen / display problem","Keyboard problem","SSD / HDD problem","Heating problem","Wi-Fi problem","Sound problem","Camera problem","Windows / software problem","Other issue"];
let service="",brand="",issue="";const modal=document.getElementById("modal"),brands=document.getElementById("brands"),issuesEl=document.getElementById("issues"),model=document.getElementById("model");
Object.keys(data).forEach(b=>{let x=document.createElement("button");x.className="option";x.textContent=b;x.onclick=()=>{brand=b;document.querySelectorAll("#brands .option").forEach(e=>e.classList.remove("active"));x.classList.add("active")};brands.appendChild(x)});
issues.forEach(i=>{let x=document.createElement("button");x.className="option";x.textContent=i;x.onclick=()=>{issue=i;document.querySelectorAll("#issues .option").forEach(e=>e.classList.remove("active"));x.classList.add("active")};issuesEl.appendChild(x)});
function openFlow(s){service=s;brand="";issue="";document.getElementById("title").textContent=s;show("brandStep");document.getElementById("step").textContent="STEP 1 OF 4 • SELECT BRAND";modal.classList.add("show")}
function closeFlow(){modal.classList.remove("show")}
function show(id){["brandStep","modelStep","issueStep","detailsStep"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function goBrand(){show("brandStep");document.getElementById("step").textContent="STEP 1 OF 4 • SELECT BRAND"}
function goModel(){if(!brand){alert("Please select a brand first.");return}document.getElementById("brandText").textContent=brand;model.innerHTML=data[brand].map(x=>`<option>${x}</option>`).join("");show("modelStep");document.getElementById("step").textContent="STEP 2 OF 4 • SELECT MODEL"}
function goIssue(){document.getElementById("modelText").textContent=model.value;show("issueStep");document.getElementById("step").textContent="STEP 3 OF 4 • SELECT ISSUE"}
function goDetails(){if(!issue){alert("Please select the issue.");return}show("detailsStep");document.getElementById("step").textContent="STEP 4 OF 4 • YOUR DETAILS";document.getElementById("summary").innerHTML=`<b>Service:</b> ${service}<br><b>Brand:</b> ${brand}<br><b>Model:</b> ${model.value}<br><b>Issue:</b> ${issue}`}
function sendWhatsApp(){const n=name.value.trim(),p=phone.value.trim(),a=area.value.trim();if(!n||!p||!a){alert("Please enter your name, phone number and Bangalore area.");return}const msg=`Hello LapXpert Pro,%0A%0AService: ${service}%0ABrand: ${brand}%0AModel: ${model.value}%0AIssue: ${issue}%0AName: ${n}%0APhone: ${p}%0AArea: ${a}%0APreferred time: ${time.value||"Not specified"}%0ADetails: ${note.value||"None"}`;window.open("https://wa.me/919845885250?text="+msg,"_blank")}
