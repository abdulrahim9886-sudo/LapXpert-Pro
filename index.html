ddEventListener('click',()=>{issue=g.name+': '+i;issuesEl.querySelectorAll('.option').forEach(e=>e.classList.remove('active'));b.classList.add('active')});issuesEl.appendChild(b)})})}else{cfg.opts.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=i;b.addEventListener('click',()=>{issue=i;issuesEl.querySelectorAll('.option').forEach(e=>e.classList.remove('active'));b.classList.add('active')});issuesEl.appendChild(b)})}show('issueStep');setStep('STEP 3 OF 4 • SELECT REQUIREMENT')}
function goDetails(){if(service==='Sell Laptop'){const ids=['sellDisplay','sellPower','sellBattery','sellKeyboard','sellTouchpad','sellBody','sellAdapter','sellProcessor','sellRam','sellStorage','sellCapacity','sellLock','sellInvoice'];if(ids.some(id=>!$(id)||!$(id).value) && !confirm('Some laptop condition/specification fields are blank. Continue anyway?'))return}else if(!issue){alert('Please select a requirement.');return}const m=modelEl.value.trim();const ex=$('extraFields');ex.innerHTML='';if(service==='Sell Laptop'){ex.innerHTML='<div style="color:#54c7ff;font-weight:700;line-height:1.3;margin:8px 0">Customer Details</div>'}else if(service==='Buy Laptop'){ex.innerHTML='<div style="color:#54c7ff;font-weight:700;line-height:1.3;margin:8px 0">Laptop Requirements</div><input id="buyModel" class="field" placeholder="Preferred Model / Series (optional)"><input id="buyBudget" class="field" placeholder="Budget (₹)"><select id="buyProcessor" class="field"><option value="">Processor Preference (optional)</option><option>Intel Core i3</option><option>Intel Core i5</option><option>Intel Core i7</option><option>Intel Core i9</option><option>AMD Ryzen 3</option><option>AMD Ryzen 5</option><option>AMD Ryzen 7</option><option>Apple Silicon</option><option>Other</option></select><select id="buyRam" class="field"><option value="">RAM (optional)</option><option>4 GB</option><option>8 GB</option><option>16 GB</option><option>32 GB</option><option>64 GB+</option></select><select id="buyStorage" class="field"><option value="">Storage (optional)</option><option>256 GB SSD</option><option>512 GB SSD</option><option>1 TB SSD</option><option>2 TB SSD+</option><option>HDD</option><option>Other</option></select><select id="buyCondition" class="field"><option value="">Condition</option><option>New</option><option>Refurbished</option><option>Used</option><option>Any</option></select><select id="buyWarranty" class="field"><option value="">Warranty Required?</option><option>Yes</option><option>No</option></select>'}else if(service==='Adapters, Chargers & Docking Stations'){ex.innerHTML='<input id="quantity" class="field" type="number" min="1" value="1" placeholder="Quantity">'}else{ex.innerHTML='<input id="quantity" class="field" type="number" min="1" value="1" placeholder="Quantity (optional)">'}$('summary').innerHTML='<b>Service:</b> '+esc(service)+'<br><b>Category:</b> '+esc(brand)+'<br><b>Model / Product:</b> '+esc(m)+'<br><b>Requirement:</b> '+esc(issue);show('detailsStep');setStep('STEP 4 OF 4 • YOUR DETAILS')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
