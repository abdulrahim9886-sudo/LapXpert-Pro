}
function selectedDetails(prefix){const out=[];document.querySelectorAll('input[type=radio]:checked').forEach(x=>{if(x.name.startsWith(prefix+'_'))out.push(x.name.slice(prefix.length+1)+': '+x.value)});document.querySelectorAll(prefix==='sell'?'[data-sell]':'[data-buy]').forEach(x=>{if(x.value.trim())out.push((x.dataset.sell||x.dataset.buy)+': '+x.value.trim())});return out.join('\n')}
function sendWhatsApp(){const n=$('name').value.trim(),p=$('phone').value.trim(),a=$('area').value.trim(),t=$('time').value.trim(),serial=$('serial').value.trim(),note=$('note').value.trim(),home=$('homeService').checked?'Yes':'No',pickup=$('pickup').checked?'Yes':'No',photo=$('photo').files.length?'Selected, please attach in WhatsApp':'Not selected';if(!n||!p||!a){alert('Please enter your name, phone number and Bangalore area/address.');return}let details=service==='Sell Laptop'?selectedDetails('sell'):service==='Buy Laptop'?selectedDetails('buy'):'';const msg=`Hello LapXpert Pro,\n\nService: ${service}\n${service==='Accessories'?`Accessory Section: ${accessoryCategory}\nProduct / Requirement: ${issue}`:`Brand: ${brand}\nModel: ${modelEl.value.trim()}\nRequirement: ${issue}`}\n${details?`\nAdditional Selection Details:\n${details}\n`:''}Name: ${n}\nPhone: ${p}\nArea/Address: ${a}\nPreferred Date/Time: ${t||'Not specified'}\nSerial/Service Tag: ${serial||'Not specified'}\nHome Service: ${home}\nPickup & Drop: ${pickup}\nLaptop Photo: ${photo}\nAdditional Details: ${note||'None'}`;window.location.href='https://wa.me/919845885250?text='+encodeURIComponent(msg)}
// Brand buttons are rendered in HTML, so they remain visible even if the page is slow to initialize.
brandsEl.addEventListener('click',e=>{const b=e.target.closest('.brandOption');if(!b)return;brand=b.dataset.brand;brandsEl.querySelectorAll('.option').forEach(x=>x.classList.remove('active'));b.classList.add('active');goModel()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-service]');if(t){e.preventDefault();openFlow(t.dataset.service);return}const a=e.target.closest('[data-action]');if(a){e.preventDefault();if(a.dataset.action==='home')window.scrollTo({top:0,behavior:'smooth'});else if(a.dataset.action==='about')alert('LapXpert Pro | Benson Town, Bangalore 560046 | Laptop Repair, Buy, Sell & Home Service')}});
$('closeBtn').addEventListener('click',closeFlow);$('brandNext').addEventListener('click',goModel);$('modelNext').addEventListener('click',goIssue);$('modelBack').addEventListener('click',goBrand);$('issueNext').addEventListener('click',goDetails);$('issueBack').addEventListener('click',()=>{if(service==='Accessories')showAccessoryCategories();else goModel()});$('detailsBack').addEventListener('click',()=>{if(service==='Accessories')showAccessoryOptions(accessoryCategory);else goIssue()});$('sendBtn').addEventListener('click',sendWhatsApp);modal.addEventListener('click',e=>{if(e.target===modal)closeFlow()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFlow()});
})();
