<script>
const brandsList=["Dell","HP","Lenovo","Apple","ASUS","Acer","MSI","Toshiba","Samsung","Microsoft","Other"];
const models={Dell:["Latitude","Inspiron","Vostro","Precision","XPS","Alienware","G Series","Latitude 7490","Latitude 5420","Precision 5550","Precision 5560","Precision 5570","Other / Enter Model"],HP:["EliteBook","ProBook","Pavilion","Envy","Spectre","ZBook","Victus","Omen","EliteBook 840 G8","ProBook 440 G8","ZBook Firefly G8","Other / Enter Model"],Lenovo:["ThinkPad T480","ThinkPad T490","ThinkPad T14","ThinkPad L470","ThinkPad L480","ThinkPad X270","ThinkPad X1 Carbon","IdeaPad","Yoga","Legion","Other / Enter Model"],Apple:["MacBook Air","MacBook Pro","MacBook Air M1","MacBook Air M2","MacBook Air M3","MacBook Air M4","MacBook Pro M1","MacBook Pro M2","MacBook Pro M3","MacBook Pro M4","MacBook Pro 13-inch","MacBook Pro 14-inch","MacBook Pro 15-inch","MacBook Pro 16-inch","A1706","A1707","A1989","A1990","A2141","A2251","A2337","A2485","Other / Enter Model"],ASUS:["VivoBook","ZenBook","ROG","TUF Gaming","ExpertBook","Other / Enter Model"],Acer:["Aspire","Swift","TravelMate","Nitro","Predator","Other / Enter Model"],MSI:["Modern","Prestige","GF Series","Katana","Raider","Creator","Other / Enter Model"],Toshiba:["Tecra","Satellite","Portégé","Other / Enter Model"],Samsung:["Galaxy Book","Notebook","Other / Enter Model"],Microsoft:["Surface Laptop","Surface Pro","Surface Book","Other / Enter Model"],Other:["Other / Enter Model"]};
const serviceConfig={
"Laptop Repair":{title:"Repair Issue",opts:["Laptop not turning on","Not charging","Battery problem","Screen / display problem","Keyboard problem","Touchpad problem","SSD / HDD problem","Heating problem","Wi-Fi problem","Sound problem","Camera problem","Windows / software problem","BIOS problem","Motherboard problem","Hinge / body damage","Liquid damage","Other issue"]},
"Screen Replacement":{title:"Screen Requirement / Issue",opts:["Broken screen","Cracked display","Flickering display","Lines on screen","No display","Dim / dark display","Dead pixels","Touchscreen not working","Screen replacement","Compatible screen","Original screen","Other requirement"]},
"Battery Replacement":{title:"Battery Requirement / Issue",opts:["Battery replacement","Battery not charging","Battery draining fast","Battery not detected","Battery swollen","Battery health poor","Original battery","Compatible battery","Other requirement"]},
"Keyboard Replacement":{title:"Keyboard Requirement / Issue",opts:["Keyboard replacement","Keys not working","Keyboard damaged","Liquid-damaged keyboard","Backlight not working","Original keyboard","Compatible keyboard","Other requirement"]},
"SSD & RAM Upgrade":{title:"SSD & RAM Requirement",opts:["SSD Upgrade","RAM Upgrade","SSD + RAM Upgrade","Replace Existing SSD","M.2 NVMe SSD","2.5-inch SATA SSD","SSD Cloning","RAM Upgrade / Compatibility","SSD Not Detected","RAM Not Detected","Windows Installation + SSD","SSD Performance Issue","Other"]},
"OS Installation":{title:"OS / Software Requirement",opts:["Windows Installation","Windows 11 Installation","Windows 10 Installation","macOS Installation","macOS Upgrade","Linux Installation","OS Reinstallation","Driver Installation","Software Installation","Data Backup / Restore","Other"]},
"MacBook Repair":{title:"MacBook Issue",opts:["Not powering on","Not charging","No display","Battery problem","Keyboard problem","Trackpad problem","Touch ID problem","macOS / software problem","SSD / Storage problem","Logic board problem","Liquid damage","Screen damage","Wi-Fi / Bluetooth problem","Speaker / sound problem","Camera problem","Overheating","Other"]},
"Adapters, Chargers & Docking Stations":{title:"Adapter / Charger / Docking Requirement",opts:["Original Adapter","Compatible Adapter","Adapter Not Working","Charger Not Charging","Charging Pin / Connector Damaged","Replacement Cable","USB-C Charger","MagSafe Charger","Adapter + Cable","Docking Station","Docking Station Not Working","USB-C Docking Station","Other Requirement"]},
"Buy Laptop":{title:"Buying Requirement",opts:["Refurbished Laptop","Used Laptop","Business Laptop","Gaming Laptop","MacBook","Budget Laptop","Student Laptop","Other"]},
"Sell Laptop":{title:"Selling Requirement",opts:["Get a Quote","Sell Used Laptop","Sell MacBook","Bulk Laptop Sale","Free Evaluation","Pickup Required","Other"]},
"Home Service":{title:"Home Service Requirement",opts:["Repair at Home","Installation at Home","SSD & RAM Upgrade at Home","Laptop Pickup & Drop","MacBook Service at Home","Other"]}
};
let service="",brand="",issue="";
const modal=document.getElementById("modal"),brandsEl=document.getElementById("brands"),issuesEl=document.getElementById("issues"),modelEl=document.getElementById("model"),modelList=document.getElementById("modelList");
brandsList.forEach(b=>{const x=document.createElement("button");x.className="option";x.textContent=b;x.onclick=()=>{brand=b;document.querySelectorAll("#brands .option").forEach(e=>e.classList.remove("active"));x.classList.add("active");populateModels()};brandsEl.appendChild(x)});
function populateModels(){modelList.innerHTML=(models[brand]||models.Other).map(m=>`<option value="${m.replaceAll('"','&quot;')}"></option>`).join("");modelEl.value=""}
function openFlow(s){service=s;brand="";issue="";document.getElementById("title").textContent=s;document.querySelectorAll("#brands .option").forEach(e=>e.classList.remove("active"));show("brandStep");document.getElementById("step").textContent="STEP 1 OF 4 • SELECT BRAND";modal.classList.add("show");document.body.style.overflow="hidden"}
function closeFlow(){modal.classList.remove("show");document.body.style.overflow=""}
function show(id){["brandStep","modelStep","issueStep","detailsStep"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function goBrand(){show("brandStep");document.getElementById("step").textContent="STEP 1 OF 4 • SELECT BRAND"}
function goModel(){if(!brand){alert("Please select a brand first.");return}document.getElementById("brandText").textContent=brand;populateModels();show("modelStep");document.getElementById("step").textContent="STEP 2 OF 4 • SELECT MODEL"}
function goIssue(){const m=modelEl.value.trim();if(!m){alert("Please select or type a model.");return}document.getElementById("modelText").textContent=m;const cfg=serviceConfig[service]||serviceConfig["Laptop Repair"];document.getElementById("issueTitle").textContent=cfg.title;issuesEl.innerHTML="";issue="";cfg.opts.forEach(i=>{const x=document.createElement("button");x.className="option";x.textContent=i;x.onclick=()=>{issue=i;document.querySelectorAll("#issues .option").forEach(e=>e.classList.remove("active"));x.classList.add("active")};issuesEl.appendChild(x)});show("issueStep");document.getElementById("step").textContent="STEP 3 OF 4 • SELECT REQUIREMENT"}
function goDetails(){if(!issue){alert("Please select a requirement.");return}show("detailsStep");document.getElementById("step").textContent="STEP 4 OF 4 • YOUR DETAILS";document.getElementById("summary").innerHTML=`<b>Service:</b> ${service}<br><b>Brand:</b> ${brand}<br><b>Model:</b> ${escapeHtml(modelEl.value.trim())}<br><b>Requirement:</b> ${escapeHtml(issue)}`}
function escapeHtml(s){return s.replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function sendWhatsApp(){const n=document.getElementById("name").value.trim(),p=document.getElementById("phone").value.trim(),a=document.getElementById("area").value.trim(),t=document.getElementById("time").value.trim(),serial=document.getElementById("serial").value.trim(),note=document.getElementById("note").value.trim(),home=document.getElementById("homeService")?.checked?"Yes":"No",pickup=document.getElementById("pickup")?.checked?"Yes":"No",photo=document.getElementById("photo")?.files.length?"Selected, please attach in WhatsApp":"Not selected";if(!n||!p||!a){alert("Please enter your name, phone number and Bangalore area/address.");return}const text=`Hello LapXpert Pro,\n\nService: ${service}\nBrand: ${brand}\nModel: ${modelEl.value.trim()}\nRequirement: ${issue}\nName: ${n}\nPhone: ${p}\nArea/Address: ${a}\nPreferred Date/Time: ${t||"Not specified"}\nSerial/Service Tag: ${serial||"Not specified"}\nHome Service: ${home}\nPickup & Drop: ${pickup}\nLaptop Photo: ${photo}\nAdditional Details: ${note||"None"}`;window.location.href="https://wa.me/919845885250?text="+encodeURIComponent(text)}
}
