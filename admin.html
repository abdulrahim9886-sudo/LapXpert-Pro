<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LapXpert Pro Admin</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><a class="brand" href="index.html"><img src="assets/logo.png" alt="LapXpert Pro"></a><a class="btn call" href="index.html">View Website</a></header>
<main class="section tinted"><div class="form-wrap"><div><span class="eyebrow">ADMIN</span><h1>Product Manager</h1><p>Add Monitor or CPU/Desktop products. This prototype saves products in this browser using localStorage.</p><p><strong>Production note:</strong> secure login/database/image storage must be added before public deployment.</p></div>
<form id="productForm" class="form"><label>Product Type<select id="pType"><option value="monitor">Monitor</option><option value="desktop">CPU / Desktop</option></select></label><label>Brand<input id="pBrand" required></label><label>Product Name / Model<input id="pName" required></label><label>Price (₹)<input id="pPrice" type="number" min="0" required></label><label>Condition<select id="pCondition"><option>New</option><option>Used</option><option>Refurbished</option></select></label><label>Size (Monitor)<input id="pSize" placeholder="e.g. 24 inch"></label><label class="wide">Specifications (Desktop)<textarea id="pSpec" placeholder="e.g. i5 8th Gen | 8GB | 256GB SSD"></textarea></label><button class="btn call full" type="submit">＋ Add / Publish Product</button></form></div>
<section class="section" style="padding-left:0;padding-right:0"><h2>Current Products</h2><div id="list" class="product-grid"></div></section></main>
<script>
const key="lapxpert_products",defaults=[{type:"monitor",brand:"Dell",name:'24" Monitor',size:"24",price:6500,condition:"Used"},{type:"desktop",brand:"Dell",name:"OptiPlex",spec:"i5 6th Gen | 8GB | 256GB SSD",price:12000,condition:"Used"}];
let products=JSON.parse(localStorage.getItem(key)||"null")||defaults;
function save(){localStorage.setItem(key,JSON.stringify(products));render()}
function render(){list.innerHTML=products.map((p,i)=>`<article class="product"><div class="photo">🖥️</div><h3>${p.brand} ${p.name}</h3><div class="tags">${p.type==="monitor"?p.size+" · "+p.condition:p.spec+" · "+p.condition}</div><div class="price">₹${Number(p.price).toLocaleString("en-IN")}</div><button class="btn light" style="margin-top:12px;width:100%" onclick="removeP(${i})">Remove</button></article>`).join("")}
function removeP(i){products.splice(i,1);save()}
productForm.addEventListener("submit",e=>{e.preventDefault();products.push({type:pType.value,brand:pBrand.value,name:pName.value,price:Number(pPrice.value),condition:pCondition.value,size:pSize.value,spec:pSpec.value});save();e.target.reset();alert("Product published in this browser.")});render();
</script></body></html>
